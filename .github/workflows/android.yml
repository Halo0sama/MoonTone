name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-37' 'build-tools;36.0.0' 'ndk;27.0.12077973'
      - name: Receiver regression tests
        run: python3 -m unittest discover -s tools/tests -v
      - name: Android unit tests, lint and debug APK
        working-directory: echolink-app
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: moontone-checks
          retention-days: 7
          path: |
            echolink-app/app/build/reports/tests/
            echolink-app/app/build/reports/lint-results-debug.*
            echolink-app/app/build/outputs/apk/debug/app-debug.apk
